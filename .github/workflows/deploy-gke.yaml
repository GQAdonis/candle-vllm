name: Build and Deploy (GKE)

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: deploy-gke-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GitHub-hosted runners can run out of disk during large Rust/CUDA builds.
      # Free space early so subsequent actions can write state/output files reliably.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            tribehealth/candle-vllm:latest
          build-args: |
            WITH_FEATURES=cuda
            RUST_TOOLCHAIN=1.92.0

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.6"

      # Most GKE kubeconfigs rely on the GKE auth exec plugin. The plugin still needs
      # Google credentials available on the runner, so we authenticate with a GCP service
      # account JSON key.
      #
      # Required secret: `GCP_SA_KEY_JSON`.
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY_JSON }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          version: ">= 470.0.0"
          install_components: "gke-gcloud-auth-plugin"

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Verify gke-gcloud-auth-plugin
        shell: bash
        run: |
          set -euo pipefail
          command -v gke-gcloud-auth-plugin
          gke-gcloud-auth-plugin --version

      - name: Write kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: Verify kube access
        shell: bash
        run: |
          set -euo pipefail
          kubectl config current-context || true
          kubectl version --client
          kubectl cluster-info
          kubectl get ns candle

      - name: OpenTofu init
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=deployment/k8s/gke init

      - name: OpenTofu apply
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=deployment/k8s/gke apply -auto-approve \
            -var "container_image=tribehealth/candle-vllm:latest" \
            -var "tls_secret_name=${CANDLE_VLLM_TLS_SECRET_NAME:-candle-tls}" \
            -var "web_tls_secret_name=${CANDLE_WEB_TLS_SECRET_NAME:-}" \
            -var "tavily_api_key=${TAVILY_API_KEY}"
        env:
          CANDLE_VLLM_TLS_SECRET_NAME: ${{ secrets.CANDLE_VLLM_TLS_SECRET_NAME }}
          CANDLE_WEB_TLS_SECRET_NAME: ${{ secrets.CANDLE_WEB_TLS_SECRET_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}

      - name: Verify deployed resources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          kubectl get deploy,svc,ingress -n candle -o wide || true
