name: Build and Deploy (GKE)

on:
  push:
    branches: ["master"]

permissions:
  contents: read

concurrency:
  group: deploy-gke-master
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            tribehealth/candle-vllm:latest

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.8.6"

      - name: Write kubeconfig
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.kube"
          echo "${KUBECONFIG_B64}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}

      - name: OpenTofu init
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=deployment/k8s/gke init

      - name: OpenTofu apply
        shell: bash
        run: |
          set -euo pipefail
          tofu -chdir=deployment/k8s/gke apply -auto-approve \
            -var "container_image=tribehealth/candle-vllm:latest" \
            -var "tls_secret_name=${CANDLE_VLLM_TLS_SECRET_NAME:-candle-tls}" \
            -var "web_tls_secret_name=${CANDLE_WEB_TLS_SECRET_NAME:-}" \
            -var "tavily_api_key=${TAVILY_API_KEY}"
        env:
          CANDLE_VLLM_TLS_SECRET_NAME: ${{ secrets.CANDLE_VLLM_TLS_SECRET_NAME }}
          CANDLE_WEB_TLS_SECRET_NAME: ${{ secrets.CANDLE_WEB_TLS_SECRET_NAME }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
