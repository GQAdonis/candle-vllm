[package]
name = "candle-vllm-core"
version = "0.4.5"
edition = "2021"
license = "MIT"
description = "Core inference engine and scheduler for candle-vllm"

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
candle-vllm-kernels = { workspace = true, optional = true }
candle-vllm-metal-kernels = { workspace = true, optional = true }
bincode = { workspace = true }
candle-core = { workspace = true }
candle-nn = { workspace = true }
derive_more = { workspace = true }
dirs = { workspace = true }
dyn-fmt = { workspace = true }
either = { workspace = true }
flume = { workspace = true }
hf-hub = { workspace = true }
itertools = { workspace = true }
lazy_static = { workspace = true }
parking_lot = { workspace = true }
rand = { workspace = true }
rayon = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde-big-array = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
tokenizers = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
half = { workspace = true, features = ["num-traits", "use-intrinsics", "rand_distr"] }
interprocess = { workspace = true }
akin = { workspace = true }
which = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true }
image = { workspace = true }
bytemuck = { workspace = true }
mpi = { workspace = true, optional = true }
rmcp = { git = "https://github.com/GQAdonis/rust-sdk.git", optional = true }
rmcp-macros = { git = "https://github.com/GQAdonis/rust-sdk.git", optional = true }
axum = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
minijinja = { workspace = true }
minijinja-contrib = { workspace = true }
chrono = { workspace = true }
indicatif = { workspace = true }
ahash = { workspace = true }
utoipa = { workspace = true }
crossbeam = { workspace = true }
prometheus_parking_lot = { workspace = true }
turboquant = { workspace = true }
num_cpus = "1.16"
async-stream = { workspace = true }
sha2 = "0.10"
shellexpand = "3.1"
sled = { version = "0.34", optional = true }
redis = { version = "0.24", optional = true, features = ["tokio-comp", "connection-manager"] }
tqdm = { workspace = true, optional = true }
flashattn-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
tempfile = "3.8"
proptest = "1.4"
mockall = "0.12"
criterion = "0.5"

[dependencies.metal]
version = "0.32.0"
features = ["mps"]
optional = true

[features]
accelerate = ["candle-core/accelerate", "candle-nn/accelerate"]
cuda = ["candle-core/cuda", "candle-nn/cuda", "dep:candle-vllm-kernels"]
metal = ["candle-core/metal", "candle-nn/metal", "dep:candle-vllm-metal-kernels", "dep:metal"]
cudnn = ["candle-core/cudnn"]
flash-attn = [
    "cuda",
    "dep:flashattn-rs",
    "flashattn-rs/flash-context",
    "candle-vllm-kernels?/no-fp8-kvcache",
]
flashattn = ["flash-attn"]
flash-decoding = [
    "cuda",
    "dep:flashattn-rs",
    "flashattn-rs/flash-decoding",
    "candle-vllm-kernels?/no-fp8-kvcache",
]
flashinfer = ["dep:candle-vllm-kernels", "candle-vllm-kernels/flashinfer"]
cutlass = ["cuda", "candle-vllm-kernels?/cutlass"]
mkl = ["candle-core/mkl", "candle-nn/mkl"]
nccl = ["candle-core/nccl"]
mpi = ["candle-core/nccl", "dep:mpi"]
graph = ["dep:tqdm"]
prompt-cache = ["prompt-cache-sled", "prompt-cache-redis"]
prompt-cache-sled = ["dep:sled"]
prompt-cache-redis = ["dep:redis"]
