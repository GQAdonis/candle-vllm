[package]
name = "candle-vllm-metal-kernels"
version = "0.4.5"
edition = "2021"
description = "Paged attention kernels for Metal device"
categories = ["science"]
license = "MIT OR Apache-2.0"

# These dependencies are only meaningful on Apple platforms (macOS/iOS).
# On other targets the crate compiles as an empty stub.
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
objc2-metal = { workspace = true }
objc2 = "0.6.3"
objc2-foundation = "0.3.2"
dispatch2 = { version = "0.3", features = ["block2"] }
thiserror = "1"
once_cell = "1.20.2"
candle-core = { workspace = true }
candle-metal-kernels = { workspace = true }

[lib]
name = "candle_vllm_metal_kernels"

[build-dependencies]
anyhow = { version = "1", features = ["backtrace"] }
